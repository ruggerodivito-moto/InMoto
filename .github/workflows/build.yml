name: iOS Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android/**'
      - '**.md'
      - '.github/workflows/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-unsigned:
    name: Build IPA (unsigned)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Build (senza firma)
        run: |
          xcodebuild \
            -scheme InMoto \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/InMoto.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive | xcpretty || true

      - name: Crea IPA dalla archive
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/InMoto.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr InMoto-unsigned.ipa Payload/
          echo "IPA creato: $(du -sh InMoto-unsigned.ipa | cut -f1)"

      - name: Carica IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: InMoto-unsigned
          path: ${{ runner.temp }}/InMoto-unsigned.ipa
          retention-days: 30
