name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK debug + Pubblica Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calcola versione
        id: version
        run: |
          VERSION="1.0.$(date +'%Y%m%d')"
          BUILD="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION-$BUILD" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Scrivi versione nel build.gradle
        working-directory: android
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.build }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ steps.version.outputs.version }}.${{ steps.version.outputs.build }}\"/" app/build.gradle.kts

      - name: Build APK debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: |
          mkdir -p out
          # Nome versionato: il numero è il build incrementale (= versionCode);
          # più alto = più recente. Confrontalo con la versione mostrata dal device.
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/InMotoAndroid_V${{ steps.version.outputs.build }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/InMoto-android.apk"

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: InMoto-APK
          path: out/*.apk

      - name: Pubblica Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "out/InMotoAndroid_V${{ steps.version.outputs.build }}.apk" \
            out/InMoto-android.apk \
            --title "InMoto Android ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})" \
            --notes "APK debug Android generato automaticamente. Installa InMotoAndroid_V${{ steps.version.outputs.build }}.apk sul telefono (consenti origini sconosciute)."
