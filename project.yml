name: InMoto
options:
  bundleIdPrefix: com.divito
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"       # iPhone only
    DEVELOPMENT_TEAM: ""              # Imposta il tuo Team ID Apple Developer
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  InMoto:
    type: application
    platform: iOS
    sources:
      - path: InMoto
        excludes:
          - "**/*.md"
    resources:
      - path: InMoto/Resources/routes.json
      - path: InMoto/Resources/Assets.xcassets
    info:
      path: InMoto/Info.plist
      properties:
        CFBundleDisplayName: In Moto
        CFBundleShortVersionString: "1.0.20260612"
        CFBundleVersion: "32"
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: >
          InMoto usa la tua posizione per la navigazione GPS e l'avanzamento automatico tra le tappe.
        NSLocationAlwaysAndWhenInUseUsageDescription: >
          InMoto usa la tua posizione in background per continuare la navigazione GPS con schermo spento.
        UIBackgroundModes:
          - location
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - googlemaps
        UIRequiresFullScreen: false
    scheme:
      testTargets: []
